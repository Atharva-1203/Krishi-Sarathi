<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Guided Consultation - Krishi Sarathi</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="js/main.js" defer></script>
  <script>
    window.addEventListener('load', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('demo') === 'true') {
        // Pre-fill fields for demo mode
        document.getElementById('district').value = localStorage.getItem('demo_district');
        document.getElementById('n_val').value = localStorage.getItem('demo_n');
        document.getElementById('p_val').value = localStorage.getItem('demo_p');
        document.getElementById('k_val').value = localStorage.getItem('demo_k');
        document.getElementById('ph_val').value = localStorage.getItem('demo_ph');
        document.getElementById('rain_val').value = localStorage.getItem('demo_rain');
        
        // Trigger automated submission simulation
        setTimeout(() => {
          document.getElementById('pipeline-overlay').style.display = 'flex';
          let step = 0;
          const stages = [
            "Acquiring Input Data...",
            "Matching Soil Chemistry averages...",
            "Running ExtraTrees Model...",
            "Calculating TreeSHAP Local Contributions...",
            "Recommendation Ready!"
          ];
          const loaderText = document.getElementById('loader-text');
          const interval = setInterval(() => {
            if (step < stages.length) {
              loaderText.textContent = stages[step];
              step++;
            } else {
              clearInterval(interval);
              window.location.href = 'results.html?demo=true';
            }
          }, 800);
        }, 1500);
      }
    });
  </script>
</head>
<body>
  <header>
    <div class="logo-section">
      <h1 data-i18n="title">KRISHI SARATHI</h1>
      <span data-i18n="subtitle">An Explainable AI Agricultural Decision Support Platform</span>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="consultation.html">Analysis</a>
      <a href="about.html">About AI</a>
      <a href="data.html">Data Sources</a>
      <button class="primary-btn" onclick="toggleLanguage()">Language</button>
    </nav>
  </header>

  <main>
    <div class="glass-card">
      <h3 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
        Step-by-Step Agronomic Consultation
      </h3>
      <form onsubmit="event.preventDefault();" style="display: flex; flex-col; gap: 1.5rem; flex-direction: column;">
        <div>
          <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">📍 Select Farm Location</label>
          <input type="text" id="district" placeholder="Enter Maharashtra District (e.g. Pune)" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
        </div>

        <div style="display: grid; grid-template-cols: 1fr 1fr; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">Nitrogen (N) - recommended range 50-140 kg/ha</label>
            <input type="number" id="n_val" value="70" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
          </div>
          <div>
            <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">Phosphorus (P) - recommended range 30-80 kg/ha</label>
            <input type="number" id="p_val" value="50" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
          </div>
        </div>

        <div style="display: grid; grid-template-cols: 1fr 1fr; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;">
          <div>
            <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">Potassium (K) - recommended range 80-220 kg/ha</label>
            <input type="number" id="k_val" value="120" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
          </div>
          <div>
            <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">Soil pH - recommended range 6.0-7.8</label>
            <input type="number" step="0.1" id="ph_val" value="6.5" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
          </div>
        </div>

        <div>
          <label style="display: block; font-size: 0.85rem; margin-bottom: 0.5rem;">Annual Expected Rainfall (mm)</label>
          <input type="number" id="rain_val" value="950" style="width: 100%; padding: 0.75rem; background: rgba(0,0,0,0.2); border: 1px solid var(--border-color); border-radius: 0.5rem; color: #fff;">
        </div>

        <button class="primary-btn" style="width: 100%; margin-top: 1rem;">Run Crop Suitability Prediction</button>
      </form>
    </div>

    <!-- AI Pipeline Overlay -->
    <div id="pipeline-overlay" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8,15,8,0.92); z-index: 1000; align-items: center; justify-content: center; flex-direction: column; gap: 1.5rem;">
      <div style="font-size: 1.5rem; font-weight: bold; color: var(--accent-emerald);" id="loader-text">Initializing AI Agronomy Pipeline...</div>
      <div style="width: 300px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; position: relative;">
        <div style="width: 60%; height: 100%; background: var(--accent-emerald); position: absolute; left: 0; top: 0; animation: loading-slide 2s infinite ease-in-out;"></div>
      </div>
      <p style="font-size: 0.75rem; color: var(--text-muted);">Please wait. TreeSHAP is calculating local parameters.</p>
    </div>

    <style>
      @keyframes loading-slide {
        0% { left: -100%; width: 30%; }
        50% { left: 30%; width: 40%; }
        100% { left: 100%; width: 30%; }
      }
    </style>
  </main>
</body>
</html>
